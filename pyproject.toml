[tool.poetry]
name = "ml-service"
version = "0.1.0"
description = "REST + gRPC сервис для обучения и инференса ML моделей (Poetry)"
authors = ["Ваша команда <team@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"
joblib = "^1.4.0"
python-dotenv = "^1.0.1"
streamlit = "^1.38.0"
grpcio = "^1.66.0"
grpcio-tools = "^1.66.0"
boto3 = "^1.34"
dvc = {version = "^3.50.0", extras = ["s3"]}
mlflow = "^2.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.6.8"
httpx = "^0.27.0"
moto = "^5.1.18"

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "UP", "B", "ISC", "C4", "PIE", "TID"]
ignore = ["E501"]
extend-exclude = [
  ".ipynb_checkpoints",
  "app/proto/model_service_pb2.py",
  "app/proto/model_service_pb2_grpc.py",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = [
  "UP006",
  "UP007",
  "UP004",
  "C414",
  "I001",
]